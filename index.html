<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IELTS Prep">
<title>IELTS Prep · PWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#FBFAF6; --surface:#FFFFFF; --soft:#F3F2EA; --soft-2:#EFEEE5;
  --border:#EAE8DF; --border-2:#E2E0D4; --text:#1B1B19; --text-2:#76746B; --text-3:#9D9B90;
  --green:#2E7D5B; --green-soft:#E3F0E9; --blue:#4169E1; --blue-soft:#E3EDF8;
  --radius:18px; --radius-sm:13px; --shadow:0 1px 2px rgba(40,38,30,.04),0 6px 22px rgba(40,38,30,.05);
  --shadow-float:0 10px 30px rgba(0,0,0,.1), 0 2px 8px rgba(0,0,0,.04);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; line-height:1.45; padding-bottom:110px; }
#app { max-width:640px; margin:0 auto; padding:20px 20px 40px; min-height:100vh; }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }

/* Header Clean Layout avec décalage léger du titre */
.topbar-clean { 
  display:flex; 
  align-items:center; 
  justify-content:space-between; 
  padding-bottom:16px;
  margin-bottom:20px; 
  border-bottom:1px solid var(--border);
}
.brand-tt {
  padding-left: 2px;
}
.brand-tt h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; color:var(--text); }
.brand-tt p { font-size:13.5px; color:var(--text-2); font-weight:500; }
.streak { background:var(--soft); color:var(--text); font-weight:800; font-size:14px; padding:6px 14px; border-radius:999px; display:flex; align-items:center; gap:6px; border:1px solid var(--border); }
.streak-icon { font-size:16px; line-height:1; }

/* Floating Bottom Navigation (600px max, 6 onglets) */
.nav-container {
  position:fixed; 
  bottom:calc(12px + env(safe-area-inset-bottom)); 
  left:0; 
  right:0; 
  display:flex; 
  justify-content:center; 
  z-index:100; 
  padding:0 16px;
  pointer-events:none;
}
.nav-bar { 
  pointer-events:auto;
  width:100%; 
  max-width:600px; 
  background:rgba(255,255,255,0.88); 
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(234,232,223,0.8); 
  border-radius:24px; 
  display:flex; 
  justify-content:space-around; 
  padding:8px 4px; 
  box-shadow:var(--shadow-float);
}
.nav-item { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; font-weight:700; color:var(--text-3); transition:.15s var(--ease); flex:1; padding:6px 0; border-radius:16px; }
.nav-item.active { color:var(--text); background:var(--soft); }
.nav-item svg { width:18px; height:18px; }

/* Sub-navigation (Task Tabs) */
.sub-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:16px; scrollbar-width:none; }
.sub-tabs::-webkit-scrollbar { display:none; }
.tab-btn { padding:8px 14px; background:var(--soft); border-radius:10px; font-size:13px; font-weight:600; color:var(--text-2); white-space:nowrap; transition:.15s; }
.tab-btn.active { background:var(--text); color:#fff; }

/* Cards & Containers */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
.card h2 { font-size:18px; font-weight:800; margin-bottom:6px; }
.card h3 { font-size:15px; font-weight:700; margin-bottom:8px; }
.card p { font-size:14px; color:var(--text-2); line-height:1.5; }

/* Calendar Component Scrollable & Compact */
.calendar-scroll-container {
  max-height: 210px;
  overflow-y: auto;
  padding-right: 4px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.calendar-scroll-container::-webkit-scrollbar {
  width: 4px;
}
.calendar-scroll-container::-webkit-scrollbar-thumb {
  background: var(--border-2);
  border-radius: 4px;
}

.calendar-month-block { display: flex; flex-direction: column; }
.calendar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-weight:700; font-size:13px; }
.calendar-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; text-align:center; }
.cal-day-head { font-size:10px; font-weight:700; color:var(--text-3); text-transform:uppercase; padding-bottom:2px; }

.cal-day { 
  font-size:10px; 
  font-weight:600; 
  height:28px; 
  display:flex; 
  flex-direction:column;
  align-items:center; 
  justify-content:center; 
  border-radius:6px; 
  background:var(--soft); 
  color:var(--text-2); 
  cursor:pointer; 
  transition:.15s; 
  line-height:1;
}
.cal-day .day-num { font-size:10.5px; }
.cal-day .check-icon { font-size:8px; font-weight:800; margin-top:1px; display:none; }

.cal-day.empty { background:transparent; cursor:default; }
.cal-day.today { border:1.5px solid var(--blue); color:var(--blue); font-weight:800; }
.cal-day.completed { background:var(--green-soft); color:var(--green); font-weight:800; }
.cal-day.completed .check-icon { display:block; }
.cal-day { position:relative; height:32px; }
.cal-mark { position:absolute; bottom:2px; left:0; right:0; line-height:1; letter-spacing:-1px; font-size:9px; }
.cal-mark .m-deck { color:var(--blue); }
.cal-mark .m-test { color:#C8842E; }
.cal-mark .m-exo { color:#8A5A9B; }

.cal-legend { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:10px; font-size:10.5px; color:var(--text-3); font-weight:600; }
.cal-legend span { display:inline-flex; align-items:center; gap:4px; }

/* Checklist */
.todo-item { display:flex; align-items:center; gap:12px; padding:12px; background:var(--soft); border-radius:var(--radius-sm); margin-bottom:8px; cursor:pointer; }
.todo-item.done { opacity:0.6; }
.todo-item.done .todo-text { text-decoration:line-through; }
.checkbox { width:20px; height:20px; border-radius:6px; border:2px solid var(--border-2); display:grid; place-items:center; background:#fff; font-weight:bold; font-size:12px; text-decoration:none !important; }
.todo-item.done .checkbox { background:var(--green); border-color:var(--green); color:#fff; }

/* Drag & Drop Import Zone */
.drop-zone {
  border:2px dashed var(--border-2);
  border-radius:var(--radius);
  padding:36px 20px;
  text-align:center;
  background:var(--soft);
  cursor:pointer;
  transition:.2s var(--ease);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color:var(--blue);
  background:var(--blue-soft);
}
.drop-zone svg { width:36px; height:36px; color:var(--text-2); }
.drop-zone p { font-size:14px; font-weight:600; color:var(--text); }
.drop-zone span { font-size:12px; color:var(--text-3); }
#file-input { display:none; }

/* Status message for Import */
.import-status { margin-top:14px; padding:12px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; display:none; }
.import-status.success { display:block; background:var(--green-soft); color:var(--green); }
.import-status.error { display:block; background:#FDE8E8; color:#E53E3E; }

/* Placeholder Box */
.placeholder-box { border:2px dashed var(--border-2); border-radius:var(--radius-sm); padding:30px 20px; text-align:center; color:var(--text-3); font-size:13.5px; font-weight:500; margin-top:10px; }

/* Skill Description (overview) */
.desc-stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:14px 0 4px; }
.stat-chip { background:var(--soft); border-radius:var(--radius-sm); padding:10px 6px; text-align:center; }
.stat-chip .stat-value { font-size:15px; font-weight:800; color:var(--text); line-height:1.2; }
.stat-chip .stat-label { font-size:10px; color:var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-top:3px; }

.desc-section { margin-top:18px; }
.desc-section h3 { font-size:14px; font-weight:800; margin-bottom:6px; }
.desc-section p { font-size:13.5px; color:var(--text-2); line-height:1.55; }

.tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.tag-pill { background:var(--soft-2); border:1px solid var(--border); border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:600; color:var(--text-2); }

.tip-box { margin-top:18px; background:var(--blue-soft); border-radius:var(--radius-sm); padding:12px 14px; font-size:13px; color:var(--text); font-weight:500; display:flex; gap:10px; align-items:flex-start; line-height:1.5; }
.tip-box .tip-icon { font-size:15px; line-height:1.5; }

/* Official Examples */
.example-item { border:1px solid var(--border); border-radius:var(--radius-sm); padding:16px; margin-bottom:14px; background:var(--soft); }
.example-item:last-child { margin-bottom:0; }
.example-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.example-head h3 { font-size:14.5px; font-weight:800; flex:1 0 100%; }
.example-prompt { font-size:13.5px; color:var(--text); font-weight:500; line-height:1.55; margin-bottom:10px; font-style:italic; white-space:pre-line; }
.example-context { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; font-size:13px; color:var(--text-2); line-height:1.6; white-space:pre-line; margin-bottom:10px; }
.qa-list { display:flex; flex-direction:column; gap:6px; margin-bottom:4px; }
.qa-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer; font-size:13px; }
.qa-item .qa-q { font-weight:600; color:var(--text); }
.qa-item .qa-a { display:none; margin-top:6px; color:var(--green); font-weight:600; }
.qa-item.revealed .qa-a { display:block; }
.qa-hint { font-size:10.5px; color:var(--text-3); font-weight:600; margin:6px 0 10px; }
/* Charts & tables inside examples */
/* Les visuels débordent des marges de la carte pour gagner en largeur sur mobile. */
.example-chart { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 6px; margin:0 -10px 10px; }
.example-chart svg { display:block; width:100%; height:auto; }
.chart-caption { font-size:11px; color:var(--text-3); font-weight:600; text-align:center; margin-top:6px; }

.example-table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:4px 2px; margin:0 -10px 10px; overflow-x:auto; }
table.example-table { border-collapse:collapse; width:100%; font-size:12.5px; }
table.example-table th, table.example-table td { padding:8px 6px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
table.example-table th { font-weight:800; color:var(--text); font-size:10.5px; text-transform:uppercase; letter-spacing:.02em; }
table.example-table th:first-child, table.example-table td:first-child { text-align:left; font-weight:700; }
table.example-table tbody tr:last-child td { border-bottom:none; }

.wc-badge { font-size:10.5px; font-weight:700; color:var(--text-3); margin-left:8px; }

/* Reading passages */
.passage-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); margin:0 -10px 10px; }
.passage-title { font-size:13.5px; font-weight:800; text-align:center; padding:12px 14px 4px; }
.passage-scroll { max-height:340px; overflow-y:auto; padding:8px 14px 14px; }
.passage-scroll::-webkit-scrollbar { width:4px; }
.passage-scroll::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:4px; }
.passage-para { display:flex; gap:9px; margin-bottom:11px; }
.passage-para:last-child { margin-bottom:0; }
.para-label { flex:0 0 18px; font-size:11.5px; font-weight:800; color:var(--blue); padding-top:1px; }
.para-text { font-size:13px; color:var(--text-2); line-height:1.6; }
.passage-meta { font-size:10.5px; color:var(--text-3); font-weight:600; text-align:center; padding:0 14px 10px; }

details.passage-collapsed > summary { list-style:none; cursor:pointer; padding:12px 14px; font-size:13px; font-weight:800; color:var(--blue); display:flex; align-items:center; }
details.passage-collapsed > summary::-webkit-details-marker { display:none; }
details.passage-collapsed > summary::before { content:'▶'; font-size:9px; margin-right:8px; transition:transform .15s; }
details.passage-collapsed[open] > summary::before { transform:rotate(90deg); }
details.passage-collapsed[open] > summary { border-bottom:1px solid var(--border); }
details.passage-collapsed > summary .wc-badge { margin-left:auto; }

.q-group { margin-bottom:14px; }
.q-group:last-child { margin-bottom:0; }
.q-group-head { font-size:12px; font-weight:800; color:var(--text); text-transform:uppercase; letter-spacing:.02em; margin-bottom:4px; }
.q-group-inst { font-size:12.5px; color:var(--text-2); line-height:1.5; margin-bottom:8px; white-space:pre-line; }

/* --- Vocabulaire : decks, flashcards, test --- */
.vocab-summary { font-size:12.5px; color:var(--text-2); margin-bottom:14px; }
.vocab-bar { height:5px; background:var(--soft); border-radius:3px; overflow:hidden; margin-top:8px; }
.vocab-bar-fill { height:100%; background:var(--green); border-radius:3px; transition:width .25s; }

.dir-row { margin-bottom:14px; }
.dir-label { display:block; font-size:11px; font-weight:800; color:var(--text-3); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
.dir-switch { display:flex; gap:4px; background:var(--soft); padding:3px; border-radius:9px; }
.dir-btn { flex:1 1 0; font-family:inherit; font-size:11.5px; font-weight:700; padding:8px 4px; border:none; border-radius:7px; background:transparent; color:var(--text-3); cursor:pointer; white-space:nowrap; }
.dir-btn.active { background:var(--surface); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.06); }

.flash-dir { font-size:10px; font-weight:800; color:var(--text-3); letter-spacing:.05em; margin-bottom:12px; }

/* États de carte (modèle Anki) */
.level-track { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin:10px 0 0; }
.state-pill { display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border:1px solid; border-radius:999px; }
.level-name { font-size:10.5px; font-weight:700; color:var(--text-3); }

/* Boutons de réponse Again / Hard / Good / Easy */
.rating-row { display:flex; gap:6px; margin-top:14px; }
.rating-btn { flex:1 1 0; min-width:0; font-family:inherit; cursor:pointer; padding:11px 4px 9px; border-radius:var(--radius-sm); border:1px solid var(--rc); background:var(--surface); color:var(--rc); display:flex; flex-direction:column; align-items:center; gap:3px; }
.rating-btn:active { background:var(--rc); color:#fff; }
.rating-label { font-size:12.5px; font-weight:800; letter-spacing:-.01em; }
.rating-when { font-size:10px; font-weight:700; opacity:.8; white-space:nowrap; }
.rating-legend { font-size:10px; color:var(--text-3); text-align:center; margin-top:8px; font-weight:600; }

/* Icône crayon des réglages */
.dir-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.dir-head .dir-label { margin-bottom:0; }
.icon-btn { display:grid; place-items:center; width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text-2); cursor:pointer; }
.icon-btn svg { width:14px; height:14px; }
.icon-btn:active { background:var(--soft); }

.sched-field em { font-style:normal; color:var(--text-3); font-weight:600; }
.sched-field small { display:block; font-size:10.5px; color:var(--text-3); margin-top:4px; line-height:1.45; }
.deck-btn.tiny { font-size:10px; padding:4px 9px; color:var(--text-3); }
.deck-mini-bar { height:3px; background:var(--border); border-radius:2px; overflow:hidden; margin-top:5px; }
.deck-mini-fill { height:100%; background:var(--green); border-radius:2px; transition:width .25s; }
.deck-card.learned .deck-mini-bar { background:rgba(46,125,91,.25); }
.lvl-pill { display:inline-block; font-size:10px; font-weight:800; padding:2px 7px; border:1px solid; border-radius:999px; white-space:nowrap; }

.edit-note { font-size:11px; color:var(--text-3); line-height:1.5; margin-top:8px; }
.edit-card { border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; background:var(--surface); }
.edit-card-head { display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:800; color:var(--text-3); margin-bottom:10px; }
.edit-field { display:block; margin-bottom:8px; }
.edit-field span { display:block; font-size:10.5px; font-weight:700; color:var(--text-3); margin-bottom:3px; }
.edit-field input, .edit-field textarea {
  width:100%; font-family:inherit; font-size:13px; color:var(--text);
  padding:9px 10px; border:1px solid var(--border); border-radius:7px;
  background:var(--soft); resize:vertical; line-height:1.45;
}
.edit-field input:focus, .edit-field textarea:focus { outline:none; border-color:var(--blue); background:var(--surface); }

.deck-grid { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
.deck-card { position:relative; display:flex; align-items:center; gap:11px; padding:12px; background:var(--soft); border-radius:var(--radius-sm); border:1px solid transparent; }
.deck-card.learned { background:var(--green-soft); border-color:rgba(46,125,91,.22); }
.deck-num { flex:0 0 30px; height:30px; border-radius:8px; background:var(--surface); color:var(--text); font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }
.deck-card.learned .deck-num { background:var(--green); color:#fff; }
.deck-info { flex:1 1 auto; min-width:0; }
.deck-title { font-size:13px; font-weight:700; line-height:1.3; }
.deck-sub { font-size:11px; color:var(--text-3); margin-top:2px; }
.deck-actions { display:flex; flex-direction:column; gap:4px; flex:0 0 auto; }

.deck-btn { font-family:inherit; font-size:11.5px; font-weight:700; padding:6px 11px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text-2); cursor:pointer; white-space:nowrap; }
.deck-btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
.deck-btn.danger { background:var(--surface); border-color:var(--border-2); color:var(--text-2); }
.deck-btn.wide { flex:1 1 0; padding:11px; font-size:13px; }
.deck-badge { font-size:10.5px; font-weight:800; }
.deck-badge.ok { color:var(--green); }
.deck-badge.abs { position:absolute; top:6px; right:8px; }

.deck-block { border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:10px; }
.deck-block-head { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--soft); font-size:12px; font-weight:800; }
.deck-block-body { padding:12px; font-size:12.5px; color:var(--text-2); line-height:1.5; }
.deck-block-body p { margin-bottom:9px; }
.deck-locked { color:var(--text-3); }
.deck-prev { font-size:11.5px; color:var(--text-3); }

.vocab-topbar { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11.5px; font-weight:700; color:var(--text-3); margin-bottom:8px; }
.vocab-score { color:var(--green); }

.flashcard { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:28px 18px; text-align:center; margin:14px 0; cursor:pointer; min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.flash-term { font-size:22px; font-weight:800; line-height:1.25; }
.flash-type { font-size:11px; color:var(--text-3); font-weight:600; margin-top:6px; text-transform:uppercase; letter-spacing:.03em; }
.flash-hint { font-size:11.5px; color:var(--text-3); margin-top:20px; }
.flash-divider { width:40px; height:2px; background:var(--border-2); margin:16px 0; border-radius:2px; }
.flash-fr { font-size:16px; font-weight:700; color:var(--blue); line-height:1.35; }
.flash-example { font-size:12.5px; color:var(--text-2); font-style:italic; margin-top:12px; line-height:1.5; }
.flash-actions { display:flex; gap:8px; margin-top:14px; }

.test-prompt { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:24px 16px; text-align:center; font-size:19px; font-weight:800; margin:14px 0; line-height:1.3; }
.test-options { display:flex; flex-direction:column; gap:7px; }
.test-option { font-family:inherit; text-align:left; font-size:13px; font-weight:600; padding:13px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; line-height:1.4; }

<script>
// State Management
let currentMainTab = 'today';
let currentSubTab = 'overview';

// Date & Calendar State
const now = new Date();

function formatDateKey(year, month, day) {
  return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

// --- Persistence (localStorage) -------------------------------------------
const STORAGE_KEY = 'ielts-prep-state-v1';
const todayKeyNow = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());

function loadState() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch (e) {
    saved = null;
  }

  if (!saved) {
    // Première utilisation : pas de données sauvegardées.
    return { tasksState: { 1: false, 2: false, 3: false }, completedDays: [], lastActiveDate: todayKeyNow };
  }

  const state = {
    tasksState: saved.tasksState || { 1: false, 2: false, 3: false },
    completedDays: Array.isArray(saved.completedDays) ? saved.completedDays : [],
    lastActiveDate: saved.lastActiveDate || todayKeyNow
  };

  // Nouveau jour : on repart avec une checklist vierge (l'historique du calendrier reste intact).
  if (state.lastActiveDate !== todayKeyNow) {
    state.tasksState = { 1: false, 2: false, 3: false };
    state.lastActiveDate = todayKeyNow;
  }

  return state;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tasksState,
      completedDays,
      lastActiveDate: todayKeyNow
    }));
  } catch (e) {
    // Stockage indisponible (mode privé, quota, etc.) : on continue sans persister.
    console.warn('Impossible de sauvegarder la progression :', e);
  }
}

const initialState = loadState();
const tasksState = initialState.tasksState;
let completedDays = initialState.completedDays;
saveState();

// --- Progression du vocabulaire -------------------------------------------
// decks : { "Writing:1": {score, learned, date} }
// tests : { "Writing:1": {score, total, passed, date} }  (clé = bloc de 5 decks)
// log   : { "2026-08-28": [ {kind,skill,...} ] }  → alimente le calendrier
const VOCAB_KEY = 'ielts-prep-vocab-v1';

const DIRECTIONS = [
  { id: 'en-fr', label: 'EN → FR', short: 'EN→FR' },
  { id: 'fr-en', label: 'FR → EN', short: 'FR→EN' },
  { id: 'both', label: 'Les deux', short: 'Mixte' }
];

function loadVocab() {
  try {
    const v = JSON.parse(localStorage.getItem(VOCAB_KEY));
    if (v && typeof v === 'object') {
      return {
        decks: v.decks || {},
        tests: v.tests || {},
        log: v.log || {},
        custom: v.custom || {},
        exercises: v.exercises || {},
        cards: v.cards || {},
        settings: Object.assign({ direction: 'en-fr' }, v.settings || {})
      };
    }
  } catch (e) { /* stockage illisible : on repart à zéro */ }
  return { decks: {}, tests: {}, log: {}, custom: {}, exercises: {}, cards: {}, settings: { direction: 'en-fr' } };
}

let vocab = loadVocab();

function saveVocab() {
  try {
    localStorage.setItem(VOCAB_KEY, JSON.stringify(vocab));
  } catch (e) {
    console.warn('Impossible de sauvegarder le vocabulaire :', e);
  }
}

function logVocabEvent(entry) {
  if (!vocab.log[todayKeyNow]) vocab.log[todayKeyNow] = [];
  vocab.log[todayKeyNow].push(entry);
}

// Les decks personnalisés (édités dans l'app ou importés) écrasent le deck
// de même numéro ; un numéro inédit ajoute simplement un deck à la suite.
function getDecks(skill) {
  const map = new Map((VOCAB_DECKS[skill] || []).map(d => [d.n, d]));
  ((vocab.custom && vocab.custom[skill]) || []).forEach(c => {
    map.set(c.n, { n: c.n, title: c.title, cards: c.cards });
  });
  return [...map.values()].sort((a, b) => a.n - b.n);
}

function isDeckCustomised(skill, n) {
  return ((vocab.custom && vocab.custom[skill]) || []).some(c => c.n === n);
}

function setDirection(dir) {
  if (!DIRECTIONS.some(d => d.id === dir)) return;
  vocab.settings.direction = dir;
  saveVocab();
  render();
}

// Sens de présentation d'une carte donnée. En mode « both », on alterne
// selon l'index pour que chaque passage couvre les deux sens.
function cardIsEnToFr(index) {
  const dir = vocab.settings.direction;
  if (dir === 'fr-en') return false;
  if (dir === 'both') return index % 2 === 0;
  return true;
}

function deckKey(skill, n) { return skill + ':' + n; }

// --- Planification type Anki (SM-2) ----------------------------------------
// Quatre réponses possibles et les quatre états de carte d'Anki. Les cartes
// neuves et en apprentissage repassent dans la session courante (steps en
// minutes) ; une fois diplômées, elles reviennent à une date (intervalle en
// jours). L'état est indexé par TERME, pour survivre à l'édition d'un deck.
const RATINGS = [
  { id: 'again', label: 'Again', fr: 'À revoir', color: '#C0564F', key: 1 },
  { id: 'hard', label: 'Hard', fr: 'Difficile', color: '#C8842E', key: 2 },
  { id: 'good', label: 'Good', fr: 'Correct', color: '#2E7D5B', key: 3 },
  { id: 'easy', label: 'Easy', fr: 'Facile', color: '#4169E1', key: 4 }
];

const CARD_STATES = {
  new: { label: 'Nouvelle', color: 'var(--text-3)' },
  learning: { label: 'Apprentissage', color: '#4169E1' },
  relearning: { label: 'Réapprentissage', color: '#C0564F' },
  review: { label: 'Révision', color: 'var(--green)' }
};

// Réglages par défaut d'Anki, tous modifiables depuis l'icône crayon.
const SCHED_DEFAULTS = {
  learningSteps: [1, 10],      // minutes, cartes neuves
  relearningSteps: [10],       // minutes, après un oubli
  graduatingInterval: 1,       // jours, sortie d'apprentissage sur « Good »
  easyInterval: 4,             // jours, sortie immédiate sur « Easy »
  startingEase: 2.50,
  easyBonus: 1.30,
  hardInterval: 1.20,
  intervalModifier: 1.00,
  newInterval: 0.00,           // multiplicateur d'intervalle après un oubli
  maximumInterval: 36500       // jours
};

const SCHED_FIELDS = [
  { id: 'learningSteps', label: 'Étapes d\'apprentissage', unit: 'minutes', type: 'steps', hint: 'Séparées par un espace, ex. « 1 10 ».' },
  { id: 'relearningSteps', label: 'Étapes de réapprentissage', unit: 'minutes', type: 'steps', hint: 'Appliquées après un « Again » sur une carte en révision.' },
  { id: 'graduatingInterval', label: 'Intervalle de sortie', unit: 'jours', type: 'int', min: 1, hint: 'Délai après la dernière étape, via « Good ».' },
  { id: 'easyInterval', label: 'Intervalle « Easy »', unit: 'jours', type: 'int', min: 1, hint: 'Délai quand une carte neuve sort directement par « Easy ».' },
  { id: 'startingEase', label: 'Facilité de départ', unit: '×', type: 'float', min: 1.3, hint: 'Multiplicateur initial. Anki : 2.50.' },
  { id: 'easyBonus', label: 'Bonus « Easy »', unit: '×', type: 'float', min: 1, hint: 'Multiplicateur supplémentaire sur « Easy ».' },
  { id: 'hardInterval', label: 'Multiplicateur « Hard »', unit: '×', type: 'float', min: 1, hint: 'Appliqué à l\'intervalle sur « Hard ».' },
  { id: 'intervalModifier', label: 'Modificateur global', unit: '×', type: 'float', min: 0.1, hint: 'Allonge (>1) ou raccourcit (<1) tous les intervalles.' },
  { id: 'newInterval', label: 'Nouvel intervalle après oubli', unit: '×', type: 'float', min: 0, max: 1, hint: 'Part de l\'intervalle conservée après un « Again ». Anki : 0.' },
  { id: 'maximumInterval', label: 'Intervalle maximum', unit: 'jours', type: 'int', min: 1, hint: 'Plafond absolu.' }
];

function sched() {
  return Object.assign({}, SCHED_DEFAULTS, vocab.settings.sched || {});
}

// --- Dates -----------------------------------------------------------------
function addDays(dateKey, days) {
  const [y, m, d] = dateKey.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + Math.round(days));
  return formatDateKey(dt.getFullYear(), dt.getMonth(), dt.getDate());
}

function isDue(dateKey) {
  return !dateKey || dateKey <= todayKeyNow;
}

function formatInterval(days) {
  if (days < 1) return Math.max(1, Math.round(days * 1440)) + ' min';
  if (days < 30) return Math.round(days) + ' j';
  if (days < 365) return (days / 30).toFixed(days < 60 ? 1 : 0).replace('.0', '') + ' mois';
  return (days / 365).toFixed(1).replace('.0', '') + ' ans';
}

// --- État d'une carte ------------------------------------------------------
function freshCard() {
  return { state: 'new', step: 0, ease: sched().startingEase, interval: 0, due: null, reps: 0, lapses: 0 };
}

function deckCardStates(skill, n) {
  const key = deckKey(skill, n);
  if (!vocab.cards[key]) vocab.cards[key] = {};
  return vocab.cards[key];
}

function getCardState(skill, n, term) {
  const store = deckCardStates(skill, n);
  const raw = store[term];
  if (raw && typeof raw === 'object') return Object.assign(freshCard(), raw);
  // Migration de l'ancien système à 4 paliers (un simple entier 0–3) :
  // un palier 3 valait « acquise », on la considère diplômée et due aujourd'hui.
  if (typeof raw === 'number') {
    const migrated = freshCard();
    if (raw >= 3) {
      migrated.state = 'review';
      migrated.interval = sched().graduatingInterval;
      migrated.due = todayKeyNow;
      migrated.reps = 1;
    } else if (raw > 0) {
      migrated.state = 'learning';
      migrated.step = Math.min(raw, Math.max(0, sched().learningSteps.length - 1));
    }
    store[term] = migrated;
    return migrated;
  }
  return freshCard();
}

function setCardState(skill, n, term, state) {
  deckCardStates(skill, n)[term] = state;
}

function isGraduated(skill, n, term) {
  return getCardState(skill, n, term).state === 'review';
}

function deckProgress(skill, n) {
  const d = getDecks(skill).find(x => x.n === n);
  if (!d || !d.cards.length) return { mastered: 0, total: 0, ratio: 0, due: 0 };
  const mastered = d.cards.filter(c => isGraduated(skill, n, c.term)).length;
  const due = d.cards.filter(c => {
    const st = getCardState(skill, n, c.term);
    return st.state !== 'review' || isDue(st.due);
  }).length;
  return { mastered, total: d.cards.length, ratio: mastered / d.cards.length, due };
}

// Intervalle qu'obtiendrait la carte pour chaque réponse, sans rien modifier :
// sert à afficher le délai sous chaque bouton, comme Anki.
function previewRating(st, rating) {
  const next = applyRating(Object.assign({}, st), rating, sched());
  if (next.state === 'learning' || next.state === 'relearning') {
    const steps = next.state === 'learning' ? sched().learningSteps : sched().relearningSteps;
    const mins = steps[Math.min(next.step, steps.length - 1)] || 1;
    return mins + ' min';
  }
  return formatInterval(next.interval);
}

// Cœur de la planification. Modifie et renvoie l'état de carte.
function applyRating(st, rating, cfg) {
  const cap = v => Math.min(Math.max(v, 1 / 1440), cfg.maximumInterval);

  if (st.state === 'new' || st.state === 'learning' || st.state === 'relearning') {
    const relearn = st.state === 'relearning';
    const steps = relearn ? cfg.relearningSteps : cfg.learningSteps;

    if (rating === 'again') {
      st.state = relearn ? 'relearning' : 'learning';
      st.step = 0;
    } else if (rating === 'hard') {
      st.state = relearn ? 'relearning' : 'learning';
      st.step = Math.min(st.step, Math.max(0, steps.length - 1));
    } else if (rating === 'good') {
      st.step += 1;
      if (st.step >= steps.length) {
        st.state = 'review';
        st.interval = cap(relearn ? Math.max(cfg.graduatingInterval, st.interval) : cfg.graduatingInterval);
        st.due = addDays(todayKeyNow, st.interval);
        st.step = 0;
      } else {
        st.state = relearn ? 'relearning' : 'learning';
      }
    } else { // easy
      st.state = 'review';
      st.interval = cap(relearn ? Math.max(cfg.easyInterval, st.interval + 1) : cfg.easyInterval);
      st.due = addDays(todayKeyNow, st.interval);
      st.step = 0;
    }
    st.reps += 1;
    return st;
  }

  // Carte en révision
  const base = st.interval || cfg.graduatingInterval;
  if (rating === 'again') {
    st.lapses += 1;
    st.ease = Math.max(1.3, st.ease - 0.20);
    st.interval = cap(Math.max(cfg.graduatingInterval, base * cfg.newInterval));
    st.state = cfg.relearningSteps.length ? 'relearning' : 'review';
    st.step = 0;
    st.due = st.state === 'review' ? addDays(todayKeyNow, st.interval) : null;
  } else if (rating === 'hard') {
    st.ease = Math.max(1.3, st.ease - 0.15);
    st.interval = cap(base * cfg.hardInterval * cfg.intervalModifier);
    st.due = addDays(todayKeyNow, st.interval);
  } else if (rating === 'good') {
    st.interval = cap(base * st.ease * cfg.intervalModifier);
    st.due = addDays(todayKeyNow, st.interval);
  } else {
    st.ease = st.ease + 0.15;
    st.interval = cap(base * st.ease * cfg.easyBonus * cfg.intervalModifier);
    st.due = addDays(todayKeyNow, st.interval);
  }
  st.reps += 1;
  return st;
}

function setSchedField(id, raw) {
  const field = SCHED_FIELDS.find(f => f.id === id);
  if (!field) return;
  const cur = sched();
  let value;
  if (field.type === 'steps') {
    value = String(raw).split(/[\s,]+/).map(Number).filter(v => Number.isFinite(v) && v > 0);
    if (!value.length) return;
  } else {
    value = field.type === 'int' ? parseInt(raw, 10) : parseFloat(String(raw).replace(',', '.'));
    if (!Number.isFinite(value)) return;
    if (field.min !== undefined) value = Math.max(field.min, value);
    if (field.max !== undefined) value = Math.min(field.max, value);
  }
  cur[id] = value;
  vocab.settings.sched = cur;
  saveVocab();
}

function resetSchedDefaults() {
  if (!confirm('Rétablir les réglages par défaut d\'Anki ?')) return;
  delete vocab.settings.sched;
  saveVocab();
  render();
}

function resetDeckProgress(skill, n) {
  if (!confirm('Remettre toutes les cartes de ce deck à zéro ?')) return;
  delete vocab.cards[deckKey(skill, n)];
  delete vocab.decks[deckKey(skill, n)];
  saveVocab();
  render();
}

// Un bloc = 5 decks consécutifs. Bloc 1 = decks 1–5, bloc 2 = decks 6–10, etc.
function blockOf(n) { return Math.ceil(n / DECKS_PER_BLOCK); }

function blockDecks(skill, block) {
  const first = (block - 1) * DECKS_PER_BLOCK + 1;
  return getDecks(skill).filter(d => d.n >= first && d.n < first + DECKS_PER_BLOCK);
}

function isBlockComplete(skill, block) {
  const decks = blockDecks(skill, block);
  return decks.length === DECKS_PER_BLOCK && decks.every(d => isDeckLearned(skill, d.n));
}

function blocksFor(skill) {
  const decks = getDecks(skill);
  if (!decks.length) return [];
  const max = Math.max(...decks.map(d => d.n));
  const out = [];
  for (let b = 1; b <= blockOf(max); b++) out.push(b);
  return out;
}

function vocabDayMarks(dateKey) {
  const events = vocab.log[dateKey] || [];
  return {
    decks: events.filter(e => e.kind === 'deck').length,
    exercises: events.filter(e => e.kind === 'exercise' && e.passed).length,
    test: events.some(e => e.kind === 'test' && e.passed)
  };
}
// ---------------------------------------------------------------------------

function calculateStreak() {
  return completedDays.length;
}

function toggleTask(id) {
  tasksState[id] = !tasksState[id];
  const todayKey = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());

  const allDone = Object.values(tasksState).every(v => v === true);

  if (allDone && !completedDays.includes(todayKey)) {
    completedDays.push(todayKey);
  } else if (!allDone && completedDays.includes(todayKey)) {
    completedDays = completedDays.filter(d => d !== todayKey);
  }
  saveState();
  render();
}

function toggleCalDay(dateKey) {
  if (completedDays.includes(dateKey)) {
    completedDays = completedDays.filter(d => d !== dateKey);
  } else {
    completedDays.push(dateKey);
  }
  saveState();
  render();
}

// Un changement d'onglet doit repartir du haut : sans cela on arrive au milieu
// d'un passage de lecture après avoir fait défiler l'onglet précédent.
function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'auto' });
  document.scrollingElement && (document.scrollingElement.scrollTop = 0);
}

function switchMainTab(tab) {
  currentMainTab = tab;
  currentSubTab = 'overview';

  document.querySelectorAll('.nav-item').forEach((el, idx) => {
    const tabs = ['today', 'listening', 'reading', 'writing', 'speaking', 'import'];
    el.classList.toggle('active', tabs[idx] === tab);
  });

  render(true);
  scrollToTop();
}

function switchSubTab(subTab) {
  currentSubTab = subTab;
  render();
  scrollToTop();
}

function renderHeader(title, subtitle) {
  return `
    <div class="topbar-clean">
      <div class="brand-tt">
        <h1>${title}</h1>
        ${subtitle ? `<p>${subtitle}</p>` : ''}
      </div>
      <div class="streak">
        <span class="streak-icon">🪨</span> ${calculateStreak()}
      </div>
    </div>
  `;
}

function renderSingleMonth(year, month) {
  const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
  const dayNames = ["L", "M", "M", "J", "V", "S", "D"];

  const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
  const totalDays = new Date(year, month + 1, 0).getDate();

  let daysHTML = dayNames.map(d => `<div class="cal-day-head">${d}</div>`).join('');

  for (let i = 0; i < firstDayIndex; i++) {
    daysHTML += `<div class="cal-day empty"></div>`;
  }

  for (let day = 1; day <= totalDays; day++) {
    const dateKey = formatDateKey(year, month, day);
    const isToday = (year === now.getFullYear() && month === now.getMonth() && day === now.getDate());
    const isCompleted = completedDays.includes(dateKey);
    const marks = vocabDayMarks(dateKey);
    const title = [
      isCompleted ? 'Checklist du jour terminée' : '',
      marks.decks ? marks.decks + ' deck' + (marks.decks > 1 ? 's' : '') + ' de vocabulaire appris' : '',
      marks.exercises ? marks.exercises + ' exercice' + (marks.exercises > 1 ? 's' : '') + ' réussi' + (marks.exercises > 1 ? 's' : '') : '',
      marks.test ? 'Test de vocabulaire réussi' : ''
    ].filter(Boolean).join(' · ');

    daysHTML += `
      <div class="cal-day ${isToday ? 'today' : ''} ${isCompleted ? 'completed' : ''}"
           ${isToday ? 'id="cal-today-cell"' : ''}
           ${title ? `title="${escapeHTML(title)}"` : ''}
           onclick="toggleCalDay('${dateKey}')">
        <span class="day-num">${day}</span>
        <span class="check-icon">✓</span>
        ${(marks.test || marks.decks || marks.exercises) ? `<span class="cal-mark">${
          (marks.test ? '<b class="m-test">★</b>' : '') +
          (marks.decks ? `<b class="m-deck">${'•'.repeat(Math.min(marks.decks, marks.test ? 1 : 3))}</b>` : '') +
          (marks.exercises ? `<b class="m-exo">${'•'.repeat(Math.min(marks.exercises, marks.test || marks.decks ? 1 : 3))}</b>` : '')
        }</span>` : ''}
      </div>
    `;
  }

  const isCurrentMonth = (year === now.getFullYear() && month === now.getMonth());

  return `
    <div class="calendar-month-block" ${isCurrentMonth ? 'id="cal-current-month"' : ''}>
      <div class="calendar-header">
        <span>${monthNames[month]} ${year}</span>
      </div>
      <div class="calendar-grid">
        ${daysHTML}
      </div>
    </div>
  `;
}

function renderCalendar() {
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();
  
  let monthsHTML = '';
  for (let i = -1; i <= 1; i++) {
    const d = new Date(currentYear, currentMonth + i, 1);
    monthsHTML += renderSingleMonth(d.getFullYear(), d.getMonth());
  }

  return `
    <div class="calendar-scroll-container" id="cal-scroll-box">
      ${monthsHTML}
    </div>
    <div class="cal-legend">
      <span><b style="color:var(--green)">✓</b> checklist</span>
      <span><b style="color:var(--blue)">•</b> deck appris</span>
      <span><b style="color:#8A5A9B">•</b> exercice</span>
      <span><b style="color:#C8842E">★</b> test réussi</span>
    </div>
  `;
}

function renderSubTabs() {
  const tabs = [
    { id: 'overview', label: 'Description' },
    { id: 'examples', label: 'Exemples Officiels' },
    { id: 'vocab', label: 'Vocabulaire (Cards)' },
    { id: 'exercises', label: 'Exercices' }
  ];

  return `
    <div class="sub-tabs">
      ${tabs.map(t => `
        <button class="tab-btn ${currentSubTab === t.id ? 'active' : ''}" onclick="switchSubTab('${t.id}')">
          ${t.label}
        </button>
      `).join('')}
    </div>
  `;
}

// Descriptions officielles du format IELTS Academic (source : ielts.org).
// Speaking et Listening sont identiques en Academic et General Training ;
// Reading et Writing diffèrent (ici : version Academic).
// --- Vocabulaire : decks numérotés de 10 cartes ----------------------------
// Chaque ligne : [terme anglais, sens en français, nature, phrase d'exemple].
function deck(n, title, rows) {
  return { n, title, cards: rows.map(([term, fr, type, example]) => ({ term, fr, type, example })) };
}

// --- Contenu importé (localStorage) ---------------------------------------
const CONTENT_KEY = 'ielts-prep-content-v1';
const SKILL_NAMES = ['Listening', 'Reading', 'Writing', 'Speaking'];

function loadContent() {
  try {
    const saved = JSON.parse(localStorage.getItem(CONTENT_KEY));
    if (saved && saved.examples) return { examples: saved.examples, replaced: saved.replaced || {} };
  } catch (e) { /* contenu illisible : on repart des exemples par défaut */ }
  return { examples: {}, replaced: {} };
}

function saveContent() {
  try {
    localStorage.setItem(CONTENT_KEY, JSON.stringify(importedContent));
  } catch (e) {
    console.warn('Impossible de sauvegarder le contenu importé :', e);
  }
}

const importedContent = loadContent();

function getExamples(skillName) {
  const custom = importedContent.examples[skillName] || [];
  const base = importedContent.replaced[skillName] ? [] : (DEFAULT_EXAMPLES[skillName] || []);
  return base.concat(custom);
}

function toggleAnswer(el) {
  el.classList.toggle('revealed');
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function countWords(str) {
  return String(str).trim().split(/\s+/).filter(Boolean).length;
}

function renderPassage(p) {
  if (!p || !Array.isArray(p.paragraphs)) return '';
  const words = p.paragraphs.reduce((n, para) => n + countWords(para.text), 0);
  const body = `
    <div class="passage-scroll">
      ${p.paragraphs.map(para => `
        <div class="passage-para">
          ${para.label ? `<div class="para-label">${escapeHTML(para.label)}</div>` : ''}
          <div class="para-text">${escapeHTML(para.text)}</div>
        </div>
      `).join('')}
    </div>
    <div class="passage-meta">${words} mots · faites défiler pour lire le texte entier</div>
  `;
  // Un transcript se replie : sans enregistrement audio, le lire d'avance
  // supprime tout l'intérêt de l'exercice.
  if (p.collapsed) {
    return `
      <details class="passage-box passage-collapsed">
        <summary>${escapeHTML(p.title || 'Voir le transcript')}<span class="wc-badge">${words} mots</span></summary>
        ${body}
      </details>
    `;
  }
  return `
    <div class="passage-box">
      ${p.title ? `<div class="passage-title">${escapeHTML(p.title)}</div>` : ''}
      ${body}
    </div>
  `;
}

function renderQuestionGroups(groups) {
  if (!Array.isArray(groups) || !groups.length) return '';
  const total = groups.reduce((n, g) => n + (g.questions || []).length, 0);
  return `
    <div class="qa-hint">${total} questions · touchez une question pour révéler la réponse</div>
    ${groups.map(g => `
      <div class="q-group">
        ${g.type ? `<div class="q-group-head">${escapeHTML(g.type)}</div>` : ''}
        ${g.instructions ? `<div class="q-group-inst">${escapeHTML(g.instructions)}</div>` : ''}
        <div class="qa-list">
          ${(g.questions || []).map(q => `
            <div class="qa-item" onclick="toggleAnswer(this)">
              <div class="qa-q">${escapeHTML(q.q)}</div>
              <div class="qa-a">${escapeHTML(q.a)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

function renderExampleTable(table, caption) {
  if (!table || !Array.isArray(table.headers) || !Array.isArray(table.rows)) return '';
  return `
    <div class="example-table-wrap">
      <table class="example-table">
        <thead><tr>${table.headers.map(h => `<th>${escapeHTML(h)}</th>`).join('')}</tr></thead>
        <tbody>
          ${table.rows.map(r => `<tr>${r.map(c => `<td>${escapeHTML(c)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${caption ? `<div class="chart-caption" style="margin:-4px 0 10px">${escapeHTML(caption)}</div>` : ''}
  `;
}

// Les graphiques intégrés sont du SVG de confiance, mais un fichier importé peut
// en contenir : on retire scripts, gestionnaires d'événements et liens externes.
function sanitizeSVG(svg) {
  const str = String(svg);
  if (!/^\s*<svg[\s>]/i.test(str)) return '';
  return str
    .replace(/<\s*(script|foreignObject|iframe|use)\b[\s\S]*?<\s*\/\s*\1\s*>/gi, '')
    .replace(/<\s*(script|foreignObject|iframe|use)\b[^>]*\/?>/gi, '')
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
    .replace(/(href|xlink:href)\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
}

function renderExamples(skillName) {
  const items = getExamples(skillName);
  if (!items.length) {
    return `<div class="placeholder-box">Aucun exemple pour <strong>${escapeHTML(skillName)}</strong>. Importez un fichier JSON depuis l'onglet Import.</div>`;
  }

  return items.map(item => {
    const metaHTML = (item.meta || []).map(m => `<span class="tag-pill">${escapeHTML(m)}</span>`).join('');

    const questionsHTML = (item.questions || []).length ? `
      <div class="qa-hint">Touchez une question pour révéler la réponse</div>
      <div class="qa-list">
        ${item.questions.map(q => `
          <div class="qa-item" onclick="toggleAnswer(this)">
            <div class="qa-q">${escapeHTML(q.q)}</div>
            <div class="qa-a">${escapeHTML(q.a)}</div>
          </div>
        `).join('')}
      </div>
    ` : '';

    return `
      <div class="example-item">
        <div class="example-head">
          <h3>${escapeHTML(item.title || 'Exemple')}</h3>
          ${metaHTML}
        </div>
        ${item.prompt ? `<p class="example-prompt">${escapeHTML(item.prompt)}</p>` : ''}
        ${item.passage ? renderPassage(item.passage) : ''}
        ${item.chart ? `<div class="example-chart">${sanitizeSVG(item.chart)}${item.chartCaption ? `<div class="chart-caption">${escapeHTML(item.chartCaption)}</div>` : ''}</div>` : ''}
        ${item.table ? renderExampleTable(item.table, item.chartCaption) : ''}
        ${item.context ? `<div class="example-context">${escapeHTML(item.context)}</div>` : ''}
        ${item.modelAnswer ? `
          <details class="model-answer">
            <summary>Voir la réponse modèle<span class="wc-badge">${countWords(item.modelAnswer)} mots</span></summary>
            <div class="model-answer-body">${escapeHTML(item.modelAnswer)}</div>
          </details>
        ` : ''}
        ${item.questionGroups ? renderQuestionGroups(item.questionGroups) : questionsHTML}
        ${item.tip ? `<div class="tip-box"><span class="tip-icon">💡</span><span>${escapeHTML(item.tip)}</span></div>` : ''}
      </div>
    `;
  }).join('');
}

function renderSkillDescription(skillName) {
  const data = SKILL_DESCRIPTIONS[skillName];
  if (!data) {
    return `<div class="placeholder-box">Description non disponible pour <strong>${skillName}</strong>.</div>`;
  }

  const statsHTML = data.stats.map(s => `
    <div class="stat-chip">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');

  const sectionsHTML = data.sections.map(s => `
    <div class="desc-section">
      <h3>${s.title}</h3>
      <p>${s.html}</p>
    </div>
  `).join('');

  const tagsHTML = data.questionTypes.map(t => `<span class="tag-pill">${t}</span>`).join('');

  return `
    <div class="desc-stats">${statsHTML}</div>
    ${sectionsHTML}
    <div class="desc-section">
      <h3>${skillName === 'Writing' || skillName === 'Speaking' ? 'Critères d\'évaluation' : 'Types de questions'}</h3>
      <div class="tag-list">${tagsHTML}</div>
    </div>
    <div class="tip-box">
      <span class="tip-icon">💡</span>
      <span>${data.tip}</span>
    </div>
  `;
}

// --- Vocabulaire : rendu et interactions -----------------------------------
// Vue courante du module (non persistée : on repart de la liste à chaque visite).
let vocabView = { mode: 'list', skill: null, n: null, i: 0, flipped: false, results: [], test: null, draft: null };

function resetVocabView() {
  vocabView = { mode: 'list', skill: null, n: null, i: 0, flipped: false, results: [], test: null, draft: null };
}

// File de la session : cartes neuves, en (ré)apprentissage, et cartes en
// révision arrivées à échéance. Si tout est à jour, on propose quand même une
// révision d'entretien plutôt qu'une file vide.
function buildDeckQueue(skill, n) {
  const d = getDecks(skill).find(x => x.n === n);
  if (!d) return [];
  const pending = d.cards.filter(c => {
    const st = getCardState(skill, n, c.term);
    return st.state !== 'review' || isDue(st.due);
  });
  if (pending.length) return shuffle(pending.map(c => c.term));
  return shuffle(d.cards.map(c => c.term));   // révision d'entretien anticipée
}

function openDeck(skill, n) {
  const queue = buildDeckQueue(skill, n);
  vocabView = {
    mode: 'flash', skill, n, i: 0, flipped: false, results: [], test: null, draft: null,
    queue, seen: 0, again: 0, graduatedHere: 0, ahead: !deckProgress(skill, n).due
  };
  render();
}

function openTable(skill, n) {
  vocabView = { mode: 'table', skill, n, i: 0, flipped: false, results: [], test: null, draft: null };
  render();
}

function backToDeckList() {
  resetVocabView();
  render();
}

function flipCard() {
  vocabView.flipped = !vocabView.flipped;
  render();
}

// Les étapes d'apprentissage d'Anki se comptent en minutes réelles. Ici la
// session est continue : on approxime le délai par une distance dans la file,
// proportionnelle à l'étape (plus l'étape est longue, plus la carte revient
// tard). Les intervalles en JOURS, eux, sont respectés à la lettre.
function requeueGap(minutes, queueLength) {
  if (minutes <= 1) return Math.min(2, queueLength);
  if (minutes <= 10) return Math.min(6, queueLength);
  return queueLength;
}

function answerCard(rating) {
  const d = currentDeck();
  const term = vocabView.queue[0];
  if (!d || term === undefined) return;
  if (!RATINGS.some(r => r.id === rating)) return;

  const skill = vocabView.skill;
  const before = getCardState(skill, d.n, term);
  const wasGraduated = before.state === 'review';
  const after = applyRating(Object.assign({}, before), rating, sched());
  setCardState(skill, d.n, term, after);

  vocabView.results.push(rating);
  vocabView.seen += 1;
  if (rating === 'again') vocabView.again += 1;
  if (!wasGraduated && after.state === 'review') vocabView.graduatedHere += 1;
  vocabView.flipped = false;

  vocabView.queue.shift();
  // Une carte encore en apprentissage repasse dans la session ; une carte
  // diplômée en sort, elle reviendra à sa date d'échéance.
  if (after.state === 'learning' || after.state === 'relearning') {
    const steps = after.state === 'learning' ? sched().learningSteps : sched().relearningSteps;
    const mins = steps[Math.min(after.step, steps.length - 1)] || 1;
    vocabView.queue.splice(requeueGap(mins, vocabView.queue.length), 0, term);
  }

  saveVocab();
  if (!vocabView.queue.length) finishDeck();
  render();
}

function currentDeck() {
  return getDecks(vocabView.skill).find(d => d.n === vocabView.n) || null;
}

function currentCard() {
  const d = currentDeck();
  if (!d || !vocabView.queue || !vocabView.queue.length) return null;
  return d.cards.find(c => c.term === vocabView.queue[0]) || null;
}

// La file se vide quand plus aucune carte n'est due aujourd'hui. Le deck est
// « acquis » lorsque toutes ses cartes sont sorties d'apprentissage (état
// « révision »), ce qui conditionne le test de synthèse du bloc.
function finishDeck() {
  const d = currentDeck();
  if (!d) return;
  const key = deckKey(vocabView.skill, d.n);
  const previous = vocab.decks[key];
  const alreadyLogged = !!(previous && previous.learned);
  const learned = isDeckLearned(vocabView.skill, d.n);

  vocab.decks[key] = {
    learned: learned || alreadyLogged,
    reviews: (previous && previous.reviews ? previous.reviews : 0) + 1,
    lastSeen: vocabView.seen,
    date: todayKeyNow
  };
  // L'acquisition n'est journalisée qu'une fois : les révisions ultérieures
  // ne doivent pas regonfler le calendrier.
  if (learned && !alreadyLogged) {
    logVocabEvent({ kind: 'deck', skill: vocabView.skill, n: d.n, score: d.cards.length });
  }
  saveVocab();
  vocabView.mode = 'deckResult';
}

function isDeckLearned(skill, n) {
  const d = getDecks(skill).find(x => x.n === n);
  if (!d || !d.cards.length) return false;
  return d.cards.every(c => isGraduated(skill, n, c.term));
}

function retryDeck() {
  openDeck(vocabView.skill, vocabView.n);
}

// --- Test de bloc (5 decks réunis) -----------------------------------------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildTest(skill, block) {
  const pool = blockDecks(skill, block).flatMap(d => d.cards);
  const picked = shuffle(pool).slice(0, Math.min(TEST_LENGTH, pool.length));
  return picked.map((card, idx) => {
    // Le test suit le sens choisi par l'utilisateur (« both » alterne).
    const enToFr = cardIsEnToFr(idx);
    const distractors = shuffle(pool.filter(c => c.term !== card.term)).slice(0, 3);
    const options = shuffle([card].concat(distractors))
      .map(c => ({ label: enToFr ? c.fr : c.term, correct: c.term === card.term }));
    return {
      prompt: enToFr ? card.term : card.fr,
      direction: enToFr ? 'EN → FR' : 'FR → EN',
      example: card.example,
      answer: enToFr ? card.fr : card.term,
      options,
      chosen: null
    };
  });
}

function startTest(skill, block) {
  vocabView = {
    mode: 'test', skill, n: null, i: 0, flipped: false, results: [], draft: null,
    test: { block, questions: buildTest(skill, block), submitted: false }
  };
  render();
}

function answerTest(optionIndex) {
  const t = vocabView.test;
  if (!t || t.submitted) return;
  const q = t.questions[vocabView.i];
  if (q.chosen !== null) return;
  q.chosen = optionIndex;
  render();
}

function nextTestQuestion() {
  const t = vocabView.test;
  if (vocabView.i < t.questions.length - 1) {
    vocabView.i += 1;
  } else {
    finishTest();
  }
  render();
}

function finishTest() {
  const t = vocabView.test;
  const score = t.questions.filter(q => q.chosen !== null && q.options[q.chosen].correct).length;
  const passed = score >= Math.min(TEST_PASS_MARK, t.questions.length);
  const key = deckKey(vocabView.skill, t.block);
  const best = vocab.tests[key];
  vocab.tests[key] = {
    score: Math.max(score, best ? best.score : 0),
    total: t.questions.length,
    passed: !!(best && best.passed) || passed,
    date: todayKeyNow
  };
  logVocabEvent({ kind: 'test', skill: vocabView.skill, block: t.block, score, total: t.questions.length, passed });
  saveVocab();
  t.submitted = true;
  t.finalScore = score;
  t.finalPassed = passed;
  vocabView.mode = 'testResult';
}

function renderDeckList(skill) {
  const decks = getDecks(skill);
  if (!decks.length) {
    return `<div class="placeholder-box">Aucun deck de vocabulaire pour <strong>${escapeHTML(skill)}</strong>. Importez un fichier JSON depuis l'onglet Import.</div>`;
  }

  const learnedCount = decks.filter(d => isDeckLearned(skill, d.n)).length;
  const totalCards = decks.reduce((n, d) => n + d.cards.length, 0);

  const blocks = blocksFor(skill).map(b => {
    const bDecks = blockDecks(skill, b);
    if (!bDecks.length) return '';
    const done = bDecks.filter(d => isDeckLearned(skill, d.n)).length;
    const ready = isBlockComplete(skill, b);
    const result = vocab.tests[deckKey(skill, b)];
    const range = `decks ${bDecks[0].n}–${bDecks[bDecks.length - 1].n}`;

    return `
      <div class="deck-block">
        <div class="deck-block-head">

        </div>
        <div class="deck-block-body">
          ${ready
            ? `<p>Les ${DECKS_PER_BLOCK} decks sont acquis. Le test porte sur les ${bDecks.reduce((n, d) => n + d.cards.length, 0)} mots réunis, dans les deux sens.</p>
               ${result ? `<p class="deck-prev">Meilleur score : ${result.score}/${result.total}${result.passed ? '' : ` — ${TEST_PASS_MARK}/${TEST_LENGTH} requis`}</p>` : ''}
               <button class="deck-btn primary" onclick="startTest('${skill}', ${b})">${result ? 'Refaire le test' : 'Lancer le test'}</button>`
            : `<p class="deck-locked">🔒 Verrouillé — ${done}/${DECKS_PER_BLOCK} decks acquis. Terminez les ${DECKS_PER_BLOCK - done} restants pour débloquer le test.</p>`}
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="vocab-summary">
      <strong>${learnedCount}/${decks.length}</strong> decks acquis · ${totalCards} cartes au total
      <div class="vocab-bar"><div class="vocab-bar-fill" style="width:${decks.length ? (learnedCount / decks.length) * 100 : 0}%"></div></div>
    </div>

    <div class="dir-row">
      <div class="dir-head">
        <span class="dir-label">Sens de révision</span>
        <button class="icon-btn" title="Réglages de planification" aria-label="Réglages de planification" onclick="openSchedSettings('${skill}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </div>
      <div class="dir-switch">
        ${DIRECTIONS.map(d => `
          <button class="dir-btn ${vocab.settings.direction === d.id ? 'active' : ''}"
                  onclick="setDirection('${d.id}')">${d.label}</button>
        `).join('')}
      </div>
    </div>

    <div class="deck-grid">
      ${decks.map(d => {
        const learned = isDeckLearned(skill, d.n);
        const p = deckProgress(skill, d.n);
        const started = d.cards.some(c => getCardState(skill, d.n, c.term).reps > 0);
        return `
          <div class="deck-card ${learned ? 'learned' : ''}">
            <div class="deck-num">${d.n}</div>

    </div>

// --- Édition d'un deck -----------------------------------------------------
// Le brouillon vit dans vocabView.draft : les champs le mettent à jour sans
// re-render, sinon la saisie perdrait le focus à chaque frappe.
function startEditDeck() {
  const d = currentDeck();
  if (!d) return;
  vocabView.draft = {
    title: d.title,
    cards: d.cards.map(c => ({ term: c.term, fr: c.fr, type: c.type, example: c.example }))
  };
  render();
}

function cancelEditDeck() {
  vocabView.draft = null;
  render();
}

function draftSet(index, field, value) {
  if (!vocabView.draft) return;
  if (index === -1) vocabView.draft.title = value;
  else if (vocabView.draft.cards[index]) vocabView.draft.cards[index][field] = value;
}

function draftAddCard() {
  if (!vocabView.draft) return;
  vocabView.draft.cards.push({ term: '', fr: '', type: '', example: '' });
  render();
}

function draftRemoveCard(index) {
  if (!vocabView.draft) return;
  vocabView.draft.cards.splice(index, 1);
  render();
}

function saveEditDeck() {
  const d = currentDeck();
  const draft = vocabView.draft;
  if (!d || !draft) return;

  const cards = draft.cards
    .map(c => ({ term: (c.term || '').trim(), fr: (c.fr || '').trim(), type: (c.type || '').trim(), example: (c.example || '').trim() }))
    .filter(c => c.term && c.fr);

  if (!cards.length) {
    alert('Un deck doit contenir au moins une carte avec un terme et un sens.');
    return;
  }

  const skill = vocabView.skill;
  if (!vocab.custom[skill]) vocab.custom[skill] = [];
  const list = vocab.custom[skill];
  const entry = { n: d.n, title: (draft.title || '').trim() || d.title, cards };
  const at = list.findIndex(c => c.n === d.n);
  if (at >= 0) list[at] = entry; else list.push(entry);

  saveVocab();
  vocabView.draft = null;
  render();
}

function resetDeck(skill, n) {
  if (!confirm('Rétablir le contenu d\'origine de ce deck ? Vos modifications seront perdues.')) return;
  const list = vocab.custom[skill] || [];
  vocab.custom[skill] = list.filter(c => c.n !== n);
  if (!vocab.custom[skill].length) delete vocab.custom[skill];
  saveVocab();
  vocabView.draft = null;
  render();
}

// --- Export : permet de repartir d'un deck existant pour le réimporter ------
function exportDeck(skill, n) {
  const d = getDecks(skill).find(x => x.n === n);
  if (!d) return;
  downloadJSON(`vocab-${skill.toLowerCase()}-deck${n}.json`, {
    type: 'vocab', skill, mode: 'merge',
    decks: [{ n: d.n, title: d.title, cards: d.cards }]
  });
}

function exportAllDecks(skill) {
  const decks = getDecks(skill);
  if (!decks.length) return;
  downloadJSON(`vocab-${skill.toLowerCase()}.json`, {
    type: 'vocab', skill, mode: 'merge',
    direction: vocab.settings.direction,
    decks: decks.map(d => ({ n: d.n, title: d.title, cards: d.cards }))
  });
}

function downloadJSON(filename, data) {
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    alert('Export impossible sur ce navigateur : ' + e.message);
  }
}

function renderTest(skill) {
  const t = vocabView.test;
  if (!t) return renderDeckList(skill);
  const q = t.questions[vocabView.i];

  const isLast = vocabView.i === t.questions.length - 1;

  return `

    <div class="test-options">

    ` : '<div class="tip-box"><span class="tip-icon">🎉</span><span>Sans faute sur les 5 decks réunis.</span></div>'}

    <div class="flash-actions">
      <button class="deck-btn wide" onclick="startTest('${skill}', ${t.block})">Refaire le test</button>
      <button class="deck-btn wide primary" onclick="backToDeckList()">Retour aux decks</button>
    </div>
  `;
}

function openSchedSettings(skill) {
  vocabView.mode = 'sched';
  if (skill) vocabView.skill = skill;
  render();
  scrollToTop();
}

// Les champs écrivent directement dans les réglages, sans re-render : sinon la
// saisie perdrait le focus à chaque frappe.
function renderSchedSettings(skill) {
  const cfg = sched();
  const custom = !!vocab.settings.sched;

  return `
    <div class="vocab-topbar">
      <button class="deck-btn" onclick="backToDeckList()">← Decks</button>
      <span>Planification</span>
      <button class="deck-btn primary" onclick="backToDeckList()">Terminé</button>
    </div>

    <div class="q-group-inst">Mêmes paramètres que les options de deck d'Anki. Les étapes d'apprentissage se jouent dans la session courante ; les intervalles de révision sont comptés en jours réels.</div>

    ${SCHED_FIELDS.map(f => {
      const val = f.type === 'steps' ? cfg[f.id].join(' ') : cfg[f.id];
      return `
        <label class="edit-field sched-field">
          <span>${escapeHTML(f.label)} <em>(${escapeHTML(f.unit)})</em></span>
          <input type="${f.type === 'steps' ? 'text' : 'number'}"
                 ${f.type === 'float' ? 'step="0.05"' : ''}
                 ${f.min !== undefined ? `min="${f.min}"` : ''}
                 ${f.max !== undefined ? `max="${f.max}"` : ''}
                 value="${escapeHTML(String(val))}"
                 oninput="setSchedField('${f.id}', this.value)">
          <small>${escapeHTML(f.hint)}</small>

    <div class="flash-actions">
      <button class="deck-btn wide danger" onclick="resetSchedDefaults()">Rétablir les valeurs d'Anki</button>
    </div>

  `;

function renderVocab(skill) {
  // La vue est propre à une compétence : changer d'onglet réinitialise.
  if (vocabView.skill && vocabView.skill !== skill) resetVocabView();
  switch (vocabView.mode) {
    case 'sched': return renderSchedSettings(skill);
    case 'flash': return renderFlash(skill);
    case 'deckResult': return renderDeckResult(skill);
    case 'table': return renderVocabTable(skill);
    case 'test': return renderTest(skill);
    case 'testResult': return renderTestResult(skill);
    default: return renderDeckList(skill);
  }
}

// --- Exercices : moteur ----------------------------------------------------
let exoView = { mode: 'list', skill: null, id: null, i: 0, answers: [], draft: '' };

function resetExoView() {
  exoView = { mode: 'list', skill: null, id: null, i: 0, answers: [], draft: '' };
}

function getExercises(skill) {
  return EXERCISES[skill] || [];
}

function currentExercise() {
  return getExercises(exoView.skill).find(e => e.id === exoView.id) || null;
}

function exoKey(skill, id) { return skill + ':' + id; }

function exoPassMark(total) {
  return Math.ceil(total * EXERCISE_PASS_RATIO);
}

// Comparaison tolérante : casse, accents, ponctuation et espaces superflus
// sont ignorés, mais pas l'orthographe du mot lui-même.
function normaliseAnswer(s) {
  return String(s)
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^\w\s%£$€]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function answerMatches(given, accept) {
  const g = normaliseAnswer(given);
  if (!g) return false;
  const tight = g.replace(/\s/g, '');
  return (accept || []).some(a => {
    const n = normaliseAnswer(a);
    return g === n || tight === n.replace(/\s/g, '');
  });
}

function isExoAnswerCorrect(question, answer) {
  if (answer === null || answer === undefined) return false;
  if (question.kind === 'input') return answerMatches(answer, question.accept);
  if (question.kind === 'tfng') return answer === question.correct;
  return answer === question.correct;
}

function expectedAnswer(question) {
  if (question.kind === 'input') return question.accept[0];
  if (question.kind === 'tfng') return question.correct;
  return question.options[question.correct];
}

function startExercise(skill, id) {
  exoView = { mode: 'run', skill, id, i: 0, answers: [], draft: '' };
  render();
  scrollToTop();
}

function backToExerciseList() {
  resetExoView();
  render();
  scrollToTop();
}

function exoSetDraft(value) {
  exoView.draft = value;
}

// Une réponse validée n'est plus modifiable : c'est ce qui rend le score
// significatif et permet d'afficher la correction immédiatement.
function exoAnswer(value) {
  const ex = currentExercise();
  if (!ex) return;
  if (exoView.answers[exoView.i] !== undefined) return;
  exoView.answers[exoView.i] = value;
  render();
}

function exoSubmitInput() {
  const value = (exoView.draft || '').trim();
  if (!value) return;
  exoAnswer(value);
  exoView.draft = '';
}

function exoNext() {
  const ex = currentExercise();
  if (!ex) return;
  if (exoView.i < ex.questions.length - 1) {
    exoView.i += 1;
    exoView.draft = '';
    render();
  } else {
    finishExercise();
  }
}

function finishExercise() {
  const ex = currentExercise();
  if (!ex) return;
  const score = ex.questions.filter((q, i) => isExoAnswerCorrect(q, exoView.answers[i])).length;
  const total = ex.questions.length;
  const passed = score >= exoPassMark(total);
  const key = exoKey(exoView.skill, ex.id);
  const best = vocab.exercises[key];

  vocab.exercises[key] = {
    score: Math.max(score, best ? best.score : 0),
    total,
    passed: !!(best && best.passed) || passed,
    date: todayKeyNow
  };
  logVocabEvent({ kind: 'exercise', skill: exoView.skill, id: ex.id, score, total, passed });
  saveVocab();

  exoView.mode = 'result';
  exoView.finalScore = score;
  exoView.finalPassed = passed;
  render();
  scrollToTop();
}

function renderExerciseList(skill) {
  const list = getExercises(skill);
  if (!list.length) {
    return `<div class="placeholder-box">Aucun exercice pour <strong>${escapeHTML(skill)}</strong>.</div>`;
  }
  const done = list.filter(e => (vocab.exercises[exoKey(skill, e.id)] || {}).passed).length;
  const totalQ = list.reduce((n, e) => n + e.questions.length, 0);

  return `
    <div class="vocab-summary">
      <strong>${done}/${list.length}</strong> exercices réussis · ${totalQ} questions au total
      <div class="vocab-bar"><div class="vocab-bar-fill" style="width:${(done / list.length) * 100}%"></div></div>
    </div>

    <div class="deck-grid">
      ${list.map((e, idx) => {
        const st = vocab.exercises[exoKey(skill, e.id)];
        const ok = st && st.passed;
        return `
          <div class="deck-card ${ok ? 'learned' : ''}">
            <div class="deck-num">${idx + 1}</div>
            <div class="deck-info">
              <div class="deck-title">${escapeHTML(e.title)}</div>
              <div class="deck-sub">${(e.meta || []).map(escapeHTML).join(' · ')}${st ? ` · meilleur : ${st.score}/${st.total}` : ''}</div>
            </div>
            <div class="deck-actions">
              <button class="deck-btn primary" onclick="startExercise('${skill}','${e.id}')">${st ? 'Refaire' : 'Commencer'}</button>
            </div>
            ${ok ? '<div class="deck-badge ok abs">✓</div>' : ''}
          </div>
        `;
      }).join('')}
    </div>

    <div class="edit-note">Un exercice est réussi à partir de ${Math.round(EXERCISE_PASS_RATIO * 100)} % de bonnes réponses. Les réussites sont marquées dans le calendrier.</div>
  `;
}

function renderExerciseRun(skill) {
  const ex = currentExercise();
  if (!ex) return renderExerciseList(skill);
  const q = ex.questions[exoView.i];
  const given = exoView.answers[exoView.i];
  const answered = given !== undefined;
  const correct = answered && isExoAnswerCorrect(q, given);
  const isLast = exoView.i === ex.questions.length - 1;
  const scale = q.kind === 'tfng' ? TFNG_SCALES[q.scale || 'tfng'] : null;

  let input = '';
  if (q.kind === 'mcq') {
    input = `
      <div class="test-options">
        ${q.options.map((o, idx) => {
          let cls = '';
          if (answered) {
            if (idx === q.correct) cls = 'correct';
            else if (idx === given) cls = 'wrong';
          }
          return `<button class="test-option ${cls}" onclick="exoAnswer(${idx})">${escapeHTML(o)}</button>`;
        }).join('')}
      </div>`;
  } else if (q.kind === 'tfng') {
    input = `
      <div class="tfng-options">
        ${scale.map(opt => {
          let cls = '';
          if (answered) {
            if (opt === q.correct) cls = 'correct';
            else if (opt === given) cls = 'wrong';
          }
          return `<button class="test-option tfng ${cls}" onclick="exoAnswer('${opt}')">${escapeHTML(opt)}</button>`;
        }).join('')}
      </div>`;
  } else {
    input = answered
      ? `<div class="answer-given ${correct ? 'correct' : 'wrong'}">Votre réponse : <strong>${escapeHTML(String(given))}</strong></div>`
      : `<div class="input-row">
           <input type="text" id="exo-input" class="exo-input" placeholder="Votre réponse…" autocomplete="off"
                  value="${escapeHTML(exoView.draft)}"
                  oninput="exoSetDraft(this.value)"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();exoSubmitInput();}">
           <button class="deck-btn primary" onclick="exoSubmitInput()">Valider</button>
         </div>`;
  }

  return `
    <div class="vocab-topbar">
      <button class="deck-btn" onclick="backToExerciseList()">← Exercices</button>
      <span>${exoView.i + 1}/${ex.questions.length}</span>
      <span class="vocab-score">${ex.questions.filter((qq, i) => isExoAnswerCorrect(qq, exoView.answers[i])).length} ✓</span>
    </div>
    <div class="vocab-bar"><div class="vocab-bar-fill" style="width:${(exoView.i / ex.questions.length) * 100}%"></div></div>

    ${exoView.i === 0 && ex.instructions ? `<div class="q-group-inst">${escapeHTML(ex.instructions)}</div>` : ''}
    ${ex.context ? `<div class="example-context exo-context">${escapeHTML(ex.context)}</div>` : ''}

    <div class="exo-question">${escapeHTML(q.q)}</div>
    ${input}

    ${answered ? `
      <div class="exo-feedback ${correct ? 'correct' : 'wrong'}">
        <div class="exo-verdict">${correct ? '✓ Correct' : '✗ Réponse attendue : ' + escapeHTML(expectedAnswer(q))}</div>
        <div class="exo-why">${escapeHTML(q.why)}</div>
      </div>
      <div class="flash-actions">
        <button class="deck-btn wide primary" onclick="exoNext()">${isLast ? 'Voir le résultat' : 'Question suivante'}</button>
      </div>
    ` : ''}
  `;
}

function renderExerciseResult(skill) {
  const ex = currentExercise();
  if (!ex) return renderExerciseList(skill);
  const total = ex.questions.length;
  const pct = Math.round((exoView.finalScore / total) * 100);
  const wrong = ex.questions
    .map((q, i) => ({ q, given: exoView.answers[i], i }))
    .filter(x => !isExoAnswerCorrect(x.q, x.given));

  return `
    <div class="result-box ${exoView.finalPassed ? 'pass' : 'fail'}">
      <div class="result-score">${exoView.finalScore}/${total}</div>
      <div class="result-label">${exoView.finalPassed ? '✓ Exercice réussi' : `Il faut ${exoPassMark(total)}/${total} pour valider`} · ${pct} %</div>
      <p>${exoView.finalPassed ? 'Enregistré dans le calendrier à la date du jour.' : 'Rien n\'est enregistré tant que l\'exercice n\'est pas réussi. Reprenez-le.'}</p>
    </div>

    ${wrong.length ? `
      <h3 class="revise-head">À revoir (${wrong.length})</h3>
      <div class="qa-list">
        ${wrong.map(x => `
          <div class="qa-item revealed" style="cursor:default">
            <div class="qa-q">${escapeHTML(x.q.q)}</div>
            <div class="qa-a">Attendu : <strong>${escapeHTML(expectedAnswer(x.q))}</strong>${x.given !== undefined ? ` · vous aviez répondu « ${escapeHTML(String(x.q.kind === 'mcq' ? x.q.options[x.given] : x.given))} »` : ''}<br>${escapeHTML(x.q.why)}</div>
          </div>
        `).join('')}
      </div>
    ` : '<div class="tip-box"><span class="tip-icon">🎉</span><span>Sans faute.</span></div>'}

    ${ex.tip ? `<div class="tip-box"><span class="tip-icon">💡</span><span>${escapeHTML(ex.tip)}</span></div>` : ''}

    <div class="flash-actions">
      <button class="deck-btn wide" onclick="startExercise('${skill}','${ex.id}')">Refaire</button>
      <button class="deck-btn wide primary" onclick="backToExerciseList()">Retour à la liste</button>
    </div>
  `;
}

function renderExercises(skill) {
  if (exoView.skill && exoView.skill !== skill) resetExoView();
  switch (exoView.mode) {
    case 'run': return renderExerciseRun(skill);
    case 'result': return renderExerciseResult(skill);
    default: return renderExerciseList(skill);
  }
}

function renderSkillModule(skillName) {
  let heading, body;

  if (currentSubTab === 'overview') {
    heading = `<h2>Format de l'épreuve</h2><p style="margin-bottom:4px">Version Academic — source : IELTS officiel (ielts.org).</p>`;
    body = renderSkillDescription(skillName);
  } else if (currentSubTab === 'examples') {
    const count = getExamples(skillName).length;
    heading = `<h2>Exemples officiels</h2><p style="margin-bottom:14px">${count} exemple${count > 1 ? 's' : ''} au format de l'épreuve, avec corrigés et réponses modèles.</p>`;
    body = renderExamples(skillName);
  } else if (currentSubTab === 'vocab') {
    const decks = getDecks(skillName);
    const learned = decks.filter(d => isDeckLearned(skillName, d.n)).length;
    heading = vocabView.mode === 'list'
      ? `<h2>Vocabulaire</h2><p style="margin-bottom:14px">${decks.length} decks de ${CARDS_PER_DECK} cartes · ${learned} acquis. Révision espacée façon Anki : les cartes neuves tournent en boucle dans la session, puis reviennent à intervalles croissants. Un test de synthèse se débloque tous les ${DECKS_PER_BLOCK} decks.</p>`
      : '';
    body = renderVocab(skillName);
  } else if (currentSubTab === 'exercises') {
    const list = getExercises(skillName);
    const done = list.filter(e => (vocab.exercises[exoKey(skillName, e.id)] || {}).passed).length;
    heading = exoView.mode === 'list'
      ? `<h2>Exercices</h2><p style="margin-bottom:14px">${list.length} drills ciblés, corrigés et notés · ${done} réussi${done > 1 ? 's' : ''}.</p>`
      : '';
    body = renderExercises(skillName);
  } else {
    heading = `<h2>${currentSubTab.toUpperCase()} - ${skillName}</h2>`;
    body = `<div class="placeholder-box">Contenu vide pour l'onglet <strong>${currentSubTab}</strong> de la section <strong>${skillName}</strong>.</div>`;
  }

  return `
    ${renderHeader(`IELTS ${skillName}`, 'Module d\'entraînement')}
    ${renderSubTabs()}

    <div class="card">
      ${heading}
      ${body}
    </div>
  `;
}
