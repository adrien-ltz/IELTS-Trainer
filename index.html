function renderImportedSummary() {
  const rows = [];

  SKILL_NAMES.forEach(s => {
    const count = (importedContent.examples[s] || []).length;
    if (count) {
      rows.push({
        label: `${s} — ${count} exemple${count > 1 ? 's' : ''}`,
        action: `clearImported('${s}')`
      });
    }
  });

  SKILL_NAMES.forEach(s => {
    const decks = (vocab.custom[s] || []);
    if (decks.length) {
      const cards = decks.reduce((n, d) => n + d.cards.length, 0);
      rows.push({
        label: `${s} — ${decks.length} deck${decks.length > 1 ? 's' : ''} personnalisé${decks.length > 1 ? 's' : ''} (${cards} carte${cards > 1 ? 's' : ''})`,
        action: `clearCustomVocab('${s}')`
      });
    }
  });

  const dir = DIRECTIONS.find(d => d.id === vocab.settings.direction);
  const dirLine = `<p style="margin-bottom:10px">Sens de révision actuel : <strong>${dir ? dir.label : vocab.settings.direction}</strong>.</p>`;

  if (!rows.length) {
    return dirLine + `<p>Aucun import pour l'instant — les sections affichent le contenu par défaut.</p>`;
  }

  return dirLine + `
    <div class="qa-list">
      ${rows.map(r => `
        <div class="qa-item" style="cursor:default; display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <span class="qa-q">${escapeHTML(r.label)}</span>
          <button class="tab-btn" onclick="${r.action}">Réinitialiser</button>
        </div>
      `).join('')}
    </div>
  `;
}

function clearCustomVocab(skillName) {
  if (!confirm(`Supprimer tous les decks personnalisés de ${skillName} et rétablir le contenu d'origine ?`)) return;
  delete vocab.custom[skillName];
  saveVocab();
  resetVocabView();
  render();
}

function clearImported(skillName) {
  delete importedContent.examples[skillName];
  delete importedContent.replaced[skillName];
  saveContent();
  render();
}

function applyVocabImport(data, fileName) {
  if (!SKILL_NAMES.includes(data.skill)) {
    throw new Error(`"${fileName}" : "skill" doit valoir ${SKILL_NAMES.join(', ')}.`);
  }
  if (!Array.isArray(data.decks) || !data.decks.length) {
    throw new Error(`"${fileName}" : "decks" doit être un tableau non vide.`);
  }

  const decks = data.decks
    .filter(d => d && Number.isInteger(d.n) && d.n > 0 && Array.isArray(d.cards))
    .map(d => ({
      n: d.n,
      title: typeof d.title === 'string' && d.title.trim() ? d.title.trim() : `Deck ${d.n}`,
      cards: d.cards
        .filter(c => c && typeof c.term === 'string' && typeof c.fr === 'string' && c.term.trim() && c.fr.trim())
        .map(c => ({
          term: c.term.trim(),
          fr: c.fr.trim(),
          type: typeof c.type === 'string' ? c.type.trim() : '',
          example: typeof c.example === 'string' ? c.example.trim() : ''
        }))
    }))
    .filter(d => d.cards.length);

  if (!decks.length) {
    throw new Error(`"${fileName}" : aucun deck valide (chaque deck a besoin d'un "n" entier et de cartes avec "term" et "fr").`);
  }

  if (data.mode === 'replace') {
    vocab.custom[data.skill] = decks;
  } else {
    const list = vocab.custom[data.skill] || [];
    decks.forEach(d => {
      const at = list.findIndex(c => c.n === d.n);
      if (at >= 0) list[at] = d; else list.push(d);
    });
    vocab.custom[data.skill] = list;
  }

  let extra = '';
  if (typeof data.direction === 'string' && DIRECTIONS.some(d => d.id === data.direction)) {
    vocab.settings.direction = data.direction;
    extra = ` Sens de révision réglé sur « ${DIRECTIONS.find(d => d.id === data.direction).label} ».`;
  }

  saveVocab();
  const cards = decks.reduce((n, d) => n + d.cards.length, 0);
  const verb = data.mode === 'replace' ? 'remplacent les decks de' : 'importé(s) dans';
  return `${decks.length} deck${decks.length > 1 ? 's' : ''} (${cards} carte${cards > 1 ? 's' : ''}) ${verb} ${data.skill}.${extra}`;
}

function applyImport(data, fileName) {
  if (!data || (data.type !== 'examples' && data.type !== 'vocab')) {
    throw new Error(`"${fileName}" : champ "type" manquant ou différent de "examples" / "vocab".`);
  }
  if (data.type === 'vocab') return applyVocabImport(data, fileName);

  if (!SKILL_NAMES.includes(data.skill)) {
    throw new Error(`"${fileName}" : "skill" doit valoir ${SKILL_NAMES.join(', ')}.`);
  }
  if (!Array.isArray(data.items) || !data.items.length) {
    throw new Error(`"${fileName}" : "items" doit être un tableau non vide.`);
  }

  const items = data.items.filter(it => it && typeof it.title === 'string');
  if (!items.length) {
    throw new Error(`"${fileName}" : aucun item valide (chaque item doit avoir un "title").`);
  }

  if (data.mode === 'replace') {
    importedContent.examples[data.skill] = items;
    importedContent.replaced[data.skill] = true;
  } else {
    importedContent.examples[data.skill] = (importedContent.examples[data.skill] || []).concat(items);
  }
  saveContent();

  const verb = data.mode === 'replace' ? 'remplacent le contenu de' : 'ajouté(s) à';
  return `${items.length} exemple${items.length > 1 ? 's' : ''} ${verb} ${data.skill}.`;
}

function setupDragAndDrop() {
  const zone = document.getElementById('drop-zone');
  if (!zone) return;

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    zone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
  });

  ['dragenter', 'dragover'].forEach(eventName => {
    zone.addEventListener(eventName, () => zone.classList.add('dragover'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    zone.addEventListener(eventName, () => zone.classList.remove('dragover'), false);
  });

  zone.addEventListener('drop', e => {
    const dt = e.dataTransfer;
    const files = dt.files;
    processFiles(files);
  });
}

function handleFileSelect(e) {
  processFiles(e.target.files);
}

function processFiles(files) {
  const statusEl = document.getElementById('import-status');
  if (!files || files.length === 0) return;

  Array.from(files).forEach(file => {
    if (file.type !== "application/json" && !file.name.endsWith('.json')) {
      statusEl.className = "import-status error";
      statusEl.textContent = `Erreur : Le fichier "${file.name}" n'est pas un JSON valide.`;
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      let parsedData;
      try {
        parsedData = JSON.parse(e.target.result);
      } catch (err) {
        statusEl.className = "import-status error";
        statusEl.textContent = `Erreur de lecture dans "${file.name}" : Format JSON invalide.`;
        return;
      }

      let message;
      try {
        message = applyImport(parsedData, file.name);
      } catch (err) {
        statusEl.className = "import-status error";
        statusEl.textContent = `Erreur — ${err.message}`;
        return;
      }

      render();
      const newStatus = document.getElementById('import-status');
      newStatus.className = "import-status success";
      newStatus.textContent = `Succès : ${message}`;
    };
    reader.readAsText(file);
  });
}

function centerCalendarOnToday() {
  const container = document.getElementById('cal-scroll-box');
  const monthBlock = document.getElementById('cal-current-month');
  if (container && monthBlock) {
    const scrollTop = monthBlock.offsetTop - container.offsetTop - (container.clientHeight / 2) + (monthBlock.clientHeight / 2);
    container.scrollTop = scrollTop;
  }
}

function render(resetScroll = false) {
  const container = document.getElementById('cal-scroll-box');
  const savedScrollTop = (!resetScroll && container) ? container.scrollTop : null;

  const app = document.getElementById('app');
  if (currentMainTab === 'today') {
    app.innerHTML = renderToday();
  } else if (currentMainTab === 'import') {
    app.innerHTML = renderImportModule();
    setupDragAndDrop();
  } else {
    const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
    app.innerHTML = renderSkillModule(capitalize(currentMainTab));
  }

  const newContainer = document.getElementById('cal-scroll-box');
  if (newContainer) {
    if (savedScrollTop !== null) {
      newContainer.scrollTop = savedScrollTop;
    } else {
      centerCalendarOnToday();
    }
  }
}

// Initial Render
render(true);

// Service Worker (installabilité + fonctionnement hors-ligne)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('Échec de l\'enregistrement du service worker :', err);
    });
  });
}
